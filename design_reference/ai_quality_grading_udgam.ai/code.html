<h2 class="text-headline-md font-headline-md text-on-surface">Upload Produce Photos</h2>
<p class="text-body-base font-body-base text-on-surface-variant">Take a clear photo of your produce for instant AI grading and pricing estimation.</p>
</div>
<!-- Action Buttons (Camera & Gallery) -->
<div class="grid grid-cols-2 gap-md">

</button>
<button class="flex flex-col items-center justify-center gap-sm bg-surface-container-low border-[1.5px] border-outline-variant rounded-xl h-[120px] hover:bg-surface-container-high active:scale-98 transition-all border-b-[3px] hover:border-b-primary">

</div>

<span class="material-symbols-outlined text-primary-fixed" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="text-body-bold font-body-bold">Grade A - High Quality</span>
