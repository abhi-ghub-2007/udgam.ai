<style>
        .ripple {
            position: relative;
            overflow: hidden;
            transform: translate3d(0, 0, 0);
        }
        .ripple::after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #fff 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }
        .ripple:active::after {
            transform: scale(0, 0);
            opacity: .3;
            transition: 0s;
        }
        
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .5;
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-base antialiased min-h-screen flex flex-col items-center">
<!-- Top App Bar (Transactional, minimal) -->
<header class="w-full max-w-[768px] flex items-center justify-between px-gutter h-touch-target-large bg-surface sticky top-0 z-40 border-b-[1.5px] border-outline-variant">
<button aria-label="Back" class="w-12 h-12 flex items-center justify-center text-primary ripple rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-black text-primary">UDGAM.ai</h1>
<div class="w-12"></div> <!-- Spacer for balance -->
</header>
<main class="w-full max-w-[768px] flex-1 px-gutter py-lg flex flex-col pb-24">
<!-- Header & Badge -->
<div class="mb-lg">
<div class="inline-flex items-center bg-primary-container text-on-primary-container px-sm py-xs rounded-full mb-sm">
<span class="material-symbols-outlined text-[18px] mr-1" data-icon="agriculture" data-weight="fill" style="font-variation-settings: 'FILL' 1;">agriculture</span>
<span class="text-label-caps font-label-caps">Farmer Profile</span>
</div>
<h2 class="text-display-lg font-display-lg text-primary mb-xs">Create Account</h2>
<p class="text-on-surface-variant font-body-base text-body-base">Please enter your details to register as a farmer.</p>
</div>
<!-- Form Container -->
<form class="space-y-lg flex-1">
<!-- Name Input -->
<div class="flex flex-col">
<label class="text-body-bold font-body-bold text-on-surface mb-xs" for="fullName">Full Name</label>
<input class="h-touch-target-large px-md border-[1.5px] border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-[3px] focus:border-primary transition-all text-body-base font-body-base w-full placeholder-on-surface-variant" id="fullName" placeholder="Enter your full name" type="text"/>
</div>
<!-- Phone Number Input -->
<div class="flex flex-col">
<label class="text-body-bold font-body-bold text-on-surface mb-xs" for="phoneNumber">Phone Number</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant font-body-bold text-body-bold">+91</span>
<input class="h-touch-target-large pl-[60px] pr-md border-[1.5px] border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-[3px] focus:border-primary transition-all text-body-base font-body-base w-full placeholder-on-surface-variant" id="phoneNumber" placeholder="98765 43210" type="tel"/>
</div>
</div>
<!-- Location Section -->
<div class="space-y-sm bg-surface-container-low p-md rounded-xl border-[1.5px] border-outline-variant">
<h3 class="text-body-bold font-body-bold text-primary mb-sm flex items-center">
<span class="material-symbols-outlined mr-sm" data-icon="location_on" data-weight="fill" style="font-variation-settings: 'FILL' 1;">location_on</span>
                    Location Details
                </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm">
<div class="flex flex-col">
<label class="text-label-caps font-label-caps text-on-surface-variant mb-unit" for="stateSelect">State</label>
<select class="h-touch-target-large px-md border-[1.5px] border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-[3px] focus:border-primary appearance-none transition-all w-full" id="stateSelect">
<option disabled="" selected="" value="">Select State</option>
<option value="maharashtra">Maharashtra</option>
<option value="gujarat">Gujarat</option>
<option value="punjab">Punjab</option>
</select>
</div>
<div class="flex flex-col">
<label class="text-label-caps font-label-caps text-on-surface-variant mb-unit" for="districtSelect">District</label>
<select class="h-touch-target-large px-md border-[1.5px] border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-[3px] focus:border-primary appearance-none transition-all w-full opacity-50 cursor-not-allowed" disabled="" id="districtSelect">
<option disabled="" selected="" value="">Select District</option>
</select>
</div>
</div>
<div class="flex flex-col pt-xs">
<label class="text-label-caps font-label-caps text-on-surface-variant mb-unit" for="villageSelect">Village / Tehsil</label>
<input class="h-touch-target-large px-md border-[1.5px] border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface focus:outline-none focus:border-[3px] focus:border-primary transition-all w-full" id="villageSelect" placeholder="Enter village name" type="text"/>
</div>
</div>
<!-- Crops Grown Section -->
<div class="flex flex-col">
<label class="text-body-bold font-body-bold text-on-surface mb-xs flex items-center justify-between">
<span>Primary Crops Grown</span>
<span class="text-label-caps font-label-caps text-on-surface-variant font-normal">Select multiple</span>
</label>
<div class="grid grid-cols-2 md:grid-cols-3 gap-sm">
<!-- Crop Option 1 -->
<label class="relative flex flex-col items-center justify-center p-md border-[1.5px] border-outline-variant rounded-xl bg-surface-container-lowest cursor-pointer hover:bg-surface-container-high transition-colors focus-within:border-primary focus-within:border-[3px]">
<input class="sr-only peer" name="crops" type="checkbox" value="wheat"/>
<span class="material-symbols-outlined text-[32px] text-tertiary mb-xs peer-checked:text-primary" data-icon="grass">grass</span>
<span class="text-body-bold font-body-bold text-on-surface peer-checked:text-primary">Wheat</span>
<div class="absolute inset-0 border-2 border-transparent rounded-xl peer-checked:border-primary peer-checked:bg-primary-container/10 pointer-events-none transition-all"></div>
<span class="material-symbols-outlined absolute top-2 right-2 text-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<!-- Crop Option 2 -->
<label class="relative flex flex-col items-center justify-center p-md border-[1.5px] border-outline-variant rounded-xl bg-surface-container-lowest cursor-pointer hover:bg-surface-container-high transition-colors focus-within:border-primary focus-within:border-[3px]">
<input class="sr-only peer" name="crops" type="checkbox" value="rice"/>
<span class="material-symbols-outlined text-[32px] text-tertiary mb-xs peer-checked:text-primary" data-icon="water_drop">water_drop</span>
<span class="text-body-bold font-body-bold text-on-surface peer-checked:text-primary">Rice / Paddy</span>
<div class="absolute inset-0 border-2 border-transparent rounded-xl peer-checked:border-primary peer-checked:bg-primary-container/10 pointer-events-none transition-all"></div>
<span class="material-symbols-outlined absolute top-2 right-2 text-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<!-- Crop Option 3 -->
<label class="relative flex flex-col items-center justify-center p-md border-[1.5px] border-outline-variant rounded-xl bg-surface-container-lowest cursor-pointer hover:bg-surface-container-high transition-colors focus-within:border-primary focus-within:border-[3px]">
<input class="sr-only peer" name="crops" type="checkbox" value="cotton"/>
<span class="material-symbols-outlined text-[32px] text-tertiary mb-xs peer-checked:text-primary" data-icon="cloud">cloud</span>
<span class="text-body-bold font-body-bold text-on-surface peer-checked:text-primary">Cotton</span>
<div class="absolute inset-0 border-2 border-transparent rounded-xl peer-checked:border-primary peer-checked:bg-primary-container/10 pointer-events-none transition-all"></div>
<span class="material-symbols-outlined absolute top-2 right-2 text-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
<!-- Crop Option 4 -->
<label class="relative flex flex-col items-center justify-center p-md border-[1.5px] border-outline-variant rounded-xl bg-surface-container-lowest cursor-pointer hover:bg-surface-container-high transition-colors focus-within:border-primary focus-within:border-[3px]">
<input class="sr-only peer" name="crops" type="checkbox" value="sugarcane"/>
<span class="material-symbols-outlined text-[32px] text-tertiary mb-xs peer-checked:text-primary" data-icon="eco">eco</span>
<span class="text-body-bold font-body-bold text-on-surface peer-checked:text-primary">Sugarcane</span>
<div class="absolute inset-0 border-2 border-transparent rounded-xl peer-checked:border-primary peer-checked:bg-primary-container/10 pointer-events-none transition-all"></div>
<span class="material-symbols-outlined absolute top-2 right-2 text-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</label>
</div>
</div>
<!-- Action Area -->
<div class="pt-lg pb-xl mt-auto">
<button class="w-full h-[52px] bg-primary text-on-primary rounded-xl flex items-center justify-center font-body-bold text-body-bold ripple shadow-lg active:scale-98 transition-transform" type="button">
<span>Next Step</span>
<span class="material-symbols-outlined ml-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</main>
<!-- Voice Assistant FAB -->
<button aria-label="Voice Assistant" class="fixed bottom-lg right-gutter w-[64px] h-[64px] bg-secondary-container text-on-secondary-container rounded-full shadow-xl flex items-center justify-center z-50 ripple active:scale-95 transition-transform">
<div class="absolute inset-0 rounded-full border-2 border-secondary-container opacity-50 pulse-ring"></div>
<span class="material-symbols-outlined text-[32px]" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
<script>
        // Simple script to demonstrate state selection enabling district selection
        document.getElementById('stateSelect').addEventListener('change', function() {
            const districtSelect = document.getElementById('districtSelect');
            districtSelect.disabled = false;
            districtSelect.classList.remove('opacity-50', 'cursor-not-allowed');
            districtSelect.innerHTML = '<option value="" disabled selected>Select District</option><option value="d1">District 1</option><option value="d2">District 2</option>';
        });
    </script>
</body></html>
